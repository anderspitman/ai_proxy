[package]
name = "ai_proxy"
version = "0.1.0"
edition = "2024"
description = "OpenAI-compatible proxy for ChatGPT Plus/Pro accounts"
license = "MIT"

[[bin]]
name = "ai_proxy"
path = "src/main.rs"

[dependencies]
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures-util = "0.3"
http = "1"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
